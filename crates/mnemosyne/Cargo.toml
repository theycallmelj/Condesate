[package]
name = "mnemosyne"
version.workspace = true
edition.workspace = true
description = "A two-agent demo: an Opus-driven main agent (mnemosyne) whose context is periodically reset, backed by a Sonnet-driven background curator (morpheus) that builds condesate's Faraday memory structures from the raw conversation."

[[bin]]
name = "mnemosyne"
path = "src/main.rs"

[dependencies]
condesate = { path = "../condesate", features = ["remote"] }
tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
dotenvy = "0.15"
